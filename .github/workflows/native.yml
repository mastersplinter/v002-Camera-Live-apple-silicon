name: Native Apple Silicon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify native host
        run: test "$(uname -m)" = arm64
      - name: Build pinned dependencies
        run: python3 scripts/build-dependencies.py
      - name: Test library
        run: python3 scripts/swift.py test --disable-sandbox --disable-xctest
      - name: Test signing configuration validation
        run: python3 scripts/test-signing.py
      - name: Package and audit arm64 app
        run: python3 scripts/build-app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-Live-arm64
          path: dist/
